name: Flutter Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-android.yml"

permissions:
  contents: read

concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter source
        run: flutter analyze

      - name: Run deterministic tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare release signing key
        working-directory: flutter_app/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gajurmukhi-dairy-android-${{ github.sha }}
          if-no-files-found: error
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-debug.apk
            flutter_app/build/app/outputs/apk/release/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
