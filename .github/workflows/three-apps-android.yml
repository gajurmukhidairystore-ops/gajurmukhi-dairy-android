name: Gajurmukhi One combined Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - ".github/workflows/three-apps-android.yml"

permissions:
  contents: read

concurrency:
  group: gajurmukhi-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Gajurmukhi One
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: collection_inventory
            name: Gajurmukhi One
            id: com.gajurmukhi.one
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}/flutter_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Set unique Android application ID
        working-directory: apps/${{ matrix.app }}/flutter_app/android/app
        env:
          APPLICATION_ID: ${{ matrix.id }}
        run: |
          sed -i "s/applicationId = \"com.example.gajurmukhi_dairy_business_pro\"/applicationId = \"$APPLICATION_ID\"/" build.gradle.kts
          sed -i "s/namespace = \"com.example.gajurmukhi_dairy_business_pro\"/namespace = \"$APPLICATION_ID\"/" build.gradle.kts
          sed -i "s/^package com.example.gajurmukhi_dairy_business_pro$/package $APPLICATION_ID/" src/main/kotlin/com/example/gajurmukhi_dairy_business_pro/MainActivity.kt

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter source
        run: flutter analyze

      - name: Run deterministic tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Require stable release signing for in-place updates
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64; refusing an update-incompatible release" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS; refusing an update-incompatible release" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD; refusing an update-incompatible release" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "Missing ANDROID_STORE_PASSWORD; refusing an update-incompatible release" && exit 1)

      - name: Prepare release signing key
        working-directory: apps/${{ matrix.app }}/flutter_app/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build appbundle --release

      - name: Rename app artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/${{ matrix.app }}-debug.apk"
          cp build/app/outputs/apk/release/app-release.apk "build/app/outputs/apk/release/${{ matrix.app }}-release.apk"
          cp build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/${{ matrix.app }}-release.aab"

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gajurmukhi-one-android-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/${{ matrix.app }}/flutter_app/build/app/outputs/flutter-apk/${{ matrix.app }}-debug.apk
            apps/${{ matrix.app }}/flutter_app/build/app/outputs/apk/release/${{ matrix.app }}-release.apk
            apps/${{ matrix.app }}/flutter_app/build/app/outputs/bundle/release/${{ matrix.app }}-release.aab
